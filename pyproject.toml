[project]
name = "viktr"
version = "0.1.0"
description = "VICTR: Value-Informed Context Retrieval for Vision-Language-Action Models"
readme = "README.md"
requires-python = ">=3.12"
# Data-preparation utilities only (retrieval-pool construction, DINOv2 embeddings).
# Training runs in third_party/openpi's own environment -- see README.md.
dependencies = [
    # `dataset` extra: pandas/pyarrow/datasets, for reading icl-dataset's meta parquet shards.
    "lerobot[dataset]",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viktr"]

[tool.uv.sources]
# Same lerobot commit (v0.6.1) the paper's data preparation was run with.
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "7e241bd" }
