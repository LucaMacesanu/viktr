[project]
name = "viktr"
version = "0.1.0"
description = "VICTR: Value-Informed Context Retrieval for Vision-Language-Action Models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[libero,robometer]>=0.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viktr"]

[tool.uv.sources]
lerobot = { path = "third_party/lerobot", editable = true }
